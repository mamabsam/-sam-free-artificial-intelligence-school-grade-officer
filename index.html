<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>محمد سام ملک زاده</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
.rgb-border{position:fixed;inset:0;z-index:9999;pointer-events:none;padding:3px;background:linear-gradient(90deg,#ff0000,#ff7f00,#ffff00,#00ff00,#00ffff,#0000ff,#8b00ff,#ff00ff,#ff0000);background-size:400% 400%;animation:rgbMove 4s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;border-radius:2px;box-shadow:0 0 20px rgba(255,0,255,.3),inset 0 0 20px rgba(0,255,255,.2)}
@keyframes rgbMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Google Sans',Tahoma,sans-serif;background:#000;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative}
.bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 15% 10%,rgba(66,133,244,.22) 0%,transparent 55%),radial-gradient(ellipse at 85% 15%,rgba(155,114,203,.22) 0%,transparent 55%),radial-gradient(ellipse at 50% 85%,rgba(217,101,112,.18) 0%,transparent 55%),radial-gradient(ellipse at 90% 90%,rgba(242,166,0,.15) 0%,transparent 55%),radial-gradient(ellipse at 10% 60%,rgba(0,217,200,.12) 0%,transparent 55%),radial-gradient(ellipse at 70% 45%,rgba(255,100,200,.1) 0%,transparent 55%),linear-gradient(to bottom,#000 0%,#050510 25%,#0a1a2e 55%,#0e2545 85%,#12305a 100%)}
.bg-stars{position:fixed;inset:0;z-index:1;pointer-events:none;background-image:radial-gradient(2px 2px at 10% 20%,rgba(255,255,255,.95),transparent),radial-gradient(1px 1px at 30% 60%,rgba(168,199,250,.85),transparent),radial-gradient(1.5px 1.5px at 70% 30%,rgba(255,215,0,.8),transparent),radial-gradient(1px 1px at 90% 70%,rgba(217,101,112,.85),transparent),radial-gradient(1.5px 1.5px at 45% 85%,rgba(155,114,203,.8),transparent),radial-gradient(1px 1px at 60% 15%,rgba(255,255,255,.7),transparent),radial-gradient(2px 2px at 25% 45%,rgba(66,133,244,.75),transparent),radial-gradient(1px 1px at 15% 75%,rgba(0,217,200,.7),transparent);background-size:100% 100%;animation:twinkle 5s infinite}
@keyframes twinkle{0%,100%{opacity:.65}50%{opacity:1}}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;flex-shrink:0;z-index:10;position:relative;backdrop-filter:blur(24px);background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,.25) 100%);border-bottom:1px solid rgba(255,255,255,.05)}
.header-left{display:flex;align-items:center;gap:8px}
.header-right{display:flex;align-items:center;gap:8px}
.menu-icon,.compose-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;position:relative;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#e3e3e3;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.menu-icon:hover,.compose-icon:hover{background:rgba(255,255,255,.14);border-color:rgba(66,133,244,.6);box-shadow:0 0 24px rgba(66,133,244,.5);transform:translateY(-2px) scale(1.05)}
.menu-icon::before{content:'';position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:#4285f4;box-shadow:0 0 10px #4285f4,0 0 20px #4285f4;animation:pulseDot 2s infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
.menu-icon svg,.compose-icon svg{width:20px;height:20px}
.name-badge{display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:26px;background:linear-gradient(135deg,rgba(66,133,244,.15),rgba(155,114,203,.15),rgba(217,101,112,.15));border:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden;cursor:pointer}
.name-badge::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transform:translateX(-100%);animation:shine 4s infinite}
@keyframes shine{0%{transform:translateX(-100%)}50%,100%{transform:translateX(100%)}}
.name-dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#4285f4,#9b72cb,#d96570,#f2a600);background-size:300% 300%;box-shadow:0 0 14px rgba(66,133,244,.8);animation:gradShift 3s infinite;flex-shrink:0}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.name-text{font-size:1rem;font-weight:600;background:linear-gradient(90deg,#fff 0%,#a8c7fa 50%,#fff 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite;white-space:nowrap}
@keyframes shimmer{to{background-position:200% center}}
.header-title{font-size:.78rem;color:#9aa0a6;font-weight:500;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;padding:6px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(66,133,244,.04));border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(10px)}
@media(max-width:600px){.header-title{display:none}}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#4285f4,#9b72cb,#d96570,#f2a600);background-size:250% 250%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;cursor:pointer;border:2px solid rgba(255,255,255,.2);box-shadow:0 0 28px rgba(155,114,203,.6);animation:gradShift 5s infinite}
.center-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:5;text-align:center;position:relative}
.center-content.hidden{display:none}
.orbit-container{width:180px;height:180px;margin-bottom:24px;position:relative;display:flex;align-items:center;justify-content:center}
.orbit{position:absolute;border-radius:50%;border:2px solid transparent;animation:orbitSpin 8s linear infinite}
.orbit.o1{width:100%;height:100%;border-top-color:#4285f4;border-right-color:#9b72cb;animation-duration:8s;box-shadow:0 0 40px rgba(66,133,244,.4)}
.orbit.o2{width:75%;height:75%;border-top-color:#d96570;border-left-color:#f2a600;animation-duration:6s;animation-direction:reverse;box-shadow:0 0 35px rgba(217,101,112,.4)}
.orbit.o3{width:50%;height:50%;border-top-color:#00d9c0;border-right-color:#a8c7fa;animation-duration:4s;box-shadow:0 0 30px rgba(0,217,200,.4)}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
.orbit-core{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#a8c7fa 40%,#4285f4 70%,#9b72cb 100%);box-shadow:0 0 40px rgba(168,199,250,.8),0 0 80px rgba(66,133,244,.5);animation:corePulse 2s infinite}
@keyframes corePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.welcome-text{font-size:2.4rem;font-weight:700;line-height:1.3;letter-spacing:-.5px;background:linear-gradient(90deg,#4285f4 0%,#9b72cb 20%,#d96570 40%,#f2a600 60%,#00d9c0 80%,#4285f4 100%);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmerLong 6s linear infinite;margin-bottom:8px}
@keyframes shimmerLong{to{background-position:300% center}}
.welcome-name{font-size:1.8rem;font-weight:800;line-height:1.3;letter-spacing:-.5px;margin-bottom:18px;background:linear-gradient(135deg,#a8c7fa 0%,#fff 50%,#a8c7fa 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s linear infinite}
.welcome-sub{font-size:.95rem;color:#9aa0a6;padding:8px 20px;border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(66,133,244,.06));border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px}
.welcome-sub::before{content:'✨';font-size:.9rem;animation:sparkle 2s infinite}
@keyframes sparkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.7}}
.quick-actions{display:flex;gap:12px;margin-top:44px;flex-wrap:wrap;justify-content:center;max-width:640px}
.quick-btn{padding:12px 22px;border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);color:#e3e3e3;font-size:.86rem;font-family:inherit;font-weight:500;cursor:pointer;transition:all .35s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:9px}
.quick-btn:hover{background:linear-gradient(135deg,rgba(66,133,244,.18),rgba(155,114,203,.18));border-color:rgba(66,133,244,.6);box-shadow:0 0 28px rgba(66,133,244,.5);transform:translateY(-4px) scale(1.03);color:#fff}
.quick-btn svg{width:18px;height:18px}
.chat-area{flex:1;overflow-y:auto;padding:20px 16px 180px;display:none;scroll-behavior:smooth;z-index:5;position:relative}
.chat-area.active{display:block}
.chat-area::-webkit-scrollbar{width:6px}
.chat-area::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#4285f4,#9b72cb);border-radius:6px}
.message{display:flex;gap:12px;margin-bottom:24px;animation:msgIn .5s cubic-bezier(.34,1.56,.64,1);max-width:100%}
@keyframes msgIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.message.user{flex-direction:row-reverse}
.message-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;position:relative}
.message-avatar.ai{background:linear-gradient(135deg,#4285f4,#9b72cb,#d96570);background-size:200% 200%;color:#fff;box-shadow:0 0 24px rgba(66,133,244,.7);animation:gradShift 5s infinite}
.message-avatar.user-av{background:linear-gradient(135deg,#d96570,#f2a600);color:#fff;box-shadow:0 0 24px rgba(217,101,112,.7)}
.message-content{flex:1;max-width:85%}
.message.user .message-content{display:flex;flex-direction:column;align-items:flex-end}
.message-bubble{background:rgba(30,31,32,.9);border-radius:22px;padding:15px 19px;font-size:.94rem;line-height:1.85;color:#e3e3e3;word-wrap:break-word;white-space:pre-wrap;border:1px solid rgba(255,255,255,.07);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.message.user .message-bubble{background:linear-gradient(135deg,#0b57d0 0%,#1a73e8 50%,#4285f4 100%);color:#fff;border-bottom-right-radius:6px;border:none}
.message.ai .message-bubble{border-bottom-left-radius:6px;position:relative;overflow:hidden}
.message.ai .message-bubble::before{content:'';position:absolute;top:14px;bottom:14px;right:0;width:3px;background:linear-gradient(180deg,#4285f4,#9b72cb,#d96570,#f2a600);border-radius:3px}
.message-bubble img,.message-bubble video{max-width:100%;border-radius:16px;margin-top:14px;display:block}
.message-bubble audio{width:100%;margin-top:14px;border-radius:12px}
.message-bubble pre{background:#0a0a0a;padding:15px 17px;border-radius:13px;margin:12px 0;overflow-x:auto;direction:ltr;text-align:left;font-family:monospace;font-size:.82rem;line-height:1.65;border:1px solid rgba(66,133,244,.3)}
.message-bubble code{background:rgba(66,133,244,.2);padding:3px 8px;border-radius:6px;font-family:monospace;font-size:.85em;direction:ltr;display:inline-block;color:#a8c7fa}
.service-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:12px;font-size:.72rem;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,rgba(66,133,244,.2),rgba(155,114,203,.2));border:1px solid rgba(66,133,244,.3);color:#a8c7fa}
.status-list{margin-top:10px;padding:0;list-style:none}
.status-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.8rem;color:#9aa0a6}
.status-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-item .dot.pending{background:#ffc107}
.status-item .dot.success{background:#00d97e}
.status-item .dot.fail{background:#ff6b6b}
.message-actions{display:flex;gap:5px;margin-top:8px;padding:0 4px;opacity:0;transition:opacity .3s}
.message:hover .message-actions{opacity:1}
.action-btn{width:34px;height:34px;border-radius:11px;border:none;background:rgba(255,255,255,.05);color:#888;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;border:1px solid rgba(255,255,255,.05)}
.action-btn:hover{background:rgba(66,133,244,.25);color:#a8c7fa;transform:translateY(-2px) scale(1.08)}
.action-btn.done{color:#00d97e;background:rgba(0,217,126,.15)}
.action-btn svg{width:16px;height:16px}
.typing-indicator{display:flex;gap:7px;padding:8px 0}
.typing-dot{width:10px;height:10px;border-radius:50%;animation:typingBounce 1.4s infinite ease-in-out}
.typing-dot:nth-child(1){background:#4285f4}
.typing-dot:nth-child(2){animation-delay:.15s;background:#9b72cb}
.typing-dot:nth-child(3){animation-delay:.3s;background:#f2a600}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0) scale(1);opacity:.5}30%{transform:translateY(-10px) scale(1.25);opacity:1}}
.input-bar-container{position:fixed;bottom:0;left:0;right:0;padding:14px 16px 24px;background:linear-gradient(to top,rgba(14,37,69,.98) 0%,rgba(10,26,46,.9) 55%,transparent 100%);z-index:50}
.input-bar{display:flex;align-items:center;background:rgba(30,31,32,.94);border-radius:32px;padding:9px 11px;gap:8px;min-height:62px;box-shadow:0 10px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);max-width:900px;margin:0 auto;transition:all .35s}
.input-bar:focus-within{border-color:rgba(66,133,244,.65);box-shadow:0 10px 50px rgba(0,0,0,.65),0 0 50px rgba(66,133,244,.45)}
.icon-btn{width:46px;height:46px;border-radius:50%;border:none;background:transparent;color:#e3e3e3;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .3s;font-family:inherit}
.icon-btn:hover{background:rgba(66,133,244,.2);color:#a8c7fa}
.icon-btn svg{width:21px;height:21px}
.chat-input{flex:1;background:transparent;border:none;color:#e3e3e3;font-size:.97rem;font-family:inherit;outline:none;padding:10px 8px;min-width:0;direction:rtl}
.chat-input::placeholder{color:#8e918f}
.send-btn{width:48px;height:48px;border-radius:50%;border:none;background:#2b2d2f;color:#5f6368;cursor:not-allowed;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .35s;font-family:inherit}
.send-btn.active{background:linear-gradient(135deg,#4285f4,#1a73e8,#9b72cb,#d96570);color:#fff;cursor:pointer;box-shadow:0 8px 32px rgba(66,133,244,.7)}
.send-btn svg{width:22px;height:22px}
.icon-btn.recording{background:linear-gradient(135deg,#ff4444,#cc0044);color:#fff}
.file-preview{position:fixed;bottom:110px;right:16px;background:rgba(43,45,47,.97);border-radius:18px;padding:11px;display:none;align-items:center;gap:11px;max-width:310px;z-index:60;border:1px solid rgba(66,133,244,.4)}
.file-preview.show{display:flex}
.file-preview img{width:52px;height:52px;border-radius:12px;object-fit:cover}
.file-info{flex:1;min-width:0;font-size:.79rem;color:#e3e3e3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.remove-file{background:rgba(255,80,80,.15);border:none;color:#ff6b6b;cursor:pointer;font-size:1.4rem;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(43,45,47,.98);color:#e3e3e3;padding:14px 28px;border-radius:28px;font-size:.87rem;opacity:0;transition:all .4s;pointer-events:none;z-index:300;max-width:90%;text-align:center;border:1px solid rgba(66,133,244,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.particles{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;animation:float-up linear infinite}
@keyframes float-up{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100px) scale(1.8);opacity:0}}
@media(max-width:500px){.welcome-text{font-size:1.7rem}.welcome-name{font-size:1.3rem}.orbit-container{width:140px;height:140px}.orbit-core{width:48px;height:48px}.message-bubble{font-size:.88rem}.message-content{max-width:88%}.quick-btn{padding:10px 16px;font-size:.78rem}}
</style>
</head>
<body>

<div class="rgb-border"></div>
<div class="bg-canvas"></div>
<div class="bg-stars"></div>
<div class="particles" id="particles"></div>

<header class="header">
  <div class="header-left">
    <button class="menu-icon" onclick="newChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="name-badge" onclick="showToast('محمد سام ملک زاده — مدیریت: ملک زاده')">
      <span class="name-dot"></span>
      <span class="name-text">محمد سام ملک زاده</span>
    </div>
  </div>
  <div class="header-title">مدیریت و مسئولیت: ملک زاده</div>
  <div class="header-right">
    <button class="compose-icon" onclick="newChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
    </button>
    <div class="avatar" onclick="showToast('مدیریت: ملک زاده')">م</div>
  </div>
</header>

<div class="center-content" id="centerContent">
  <div class="orbit-container">
    <div class="orbit o1"></div>
    <div class="orbit o2"></div>
    <div class="orbit o3"></div>
    <div class="orbit-core"></div>
  </div>
  <div class="welcome-text">سلام 👋</div>
  <div class="welcome-name">من محمد سام ملک زاده هستم</div>
  <div class="welcome-sub">مدیریت و مسئولیت: ملک زاده</div>
  <div class="quick-actions">
    <button class="quick-btn" onclick="quickSend('یک عکس زیبا از کوهستان با نور نئون بساز')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span>🎨 عکس</span>
    </button>
    <button class="quick-btn" onclick="quickSend('یک آهنگ شاد درباره دوستی بساز')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span>🎵 آهنگ</span>
    </button>
    <button class="quick-btn" onclick="quickSend('یک ویدیو سینمایی از غروب دریا بساز')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      <span>🎬 ویدیو</span>
    </button>
    <button class="quick-btn" onclick="quickSend('یک کد پایتون برای محاسبه فاکتوریل بنویس')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      <span>💻 کد</span>
    </button>
  </div>
</div>

<div class="chat-area" id="chatArea"></div>

<div class="file-preview" id="filePreview">
  <img id="filePreviewImg" src="" alt="">
  <div class="file-info" id="fileInfo"></div>
  <button class="remove-file" onclick="removeFile()">×</button>
</div>

<div class="input-bar-container">
  <div class="input-bar">
    <button class="icon-btn" onclick="attachFile()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
    <input type="text" class="chat-input" id="chatInput" placeholder="سوال خود را بنویسید..." autocomplete="off">
    <button class="icon-btn" id="micBtn" onclick="toggleVoice()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
        <path d="M19 10v2a7 7 0 01-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">

/* ============ پیش‌بارگذاری ============ */
function preloadImage(url, t){
  t = t || 20000;
  return new Promise(function(res){
    const i = new Image();
    const to = setTimeout(function(){ i.src=''; res(false); }, t);
    i.onload = function(){ clearTimeout(to); res(true); };
    i.onerror = function(){ clearTimeout(to); res(false); };
    i.src = url;
  });
}
function preloadVideo(url, t){
  t = t || 45000;
  return new Promise(function(res){
    const v = document.createElement('video');
    const to = setTimeout(function(){ v.src=''; res(false); }, t);
    v.onloadeddata = function(){ clearTimeout(to); res(true); };
    v.onerror = function(){ clearTimeout(to); res(false); };
    v.src = url;
  });
}
function preloadAudio(url, t){
  t = t || 20000;
  return new Promise(function(res){
    const a = document.createElement('audio');
    const to = setTimeout(function(){ a.src=''; res(false); }, t);
    a.oncanplaythrough = function(){ clearTimeout(to); res(true); };
    a.onerror = function(){ clearTimeout(to); res(false); };
    a.src = url;
  });
}

        model: 'qwen/qwen3.5-0.8b',
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: prompt },
            { type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + base64 } }
          ]
        }],
        max_tokens: 500
      })
    });
    clearTimeout(to);
    if (!res.ok) return null;
    const data = await res.json();
    const reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (reply && reply.trim().length > 1) return { text: reply.trim(), service: 'VLM Run Gateway', model: 'Qwen3.5 Vision' };
  }catch(e){}
  return null;
}
async function tryNemotronVision(dataUrl, prompt){
  try{
    const base64 = dataUrl.split(',')[1];
    const ctrl = new AbortController();
    const to = setTimeout(function(){ ctrl.abort(); }, 45000);
    const res = await fetch('https://blockrun.ai/v1/vision/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl.signal,
      body: JSON.stringify({ image: base64, prompt: prompt })
    });
    clearTimeout(to);
    if (!res.ok) return null;
    const data = await res.json();
    const reply = data.text || data.description;
    if (reply && reply.length > 1) return { text: reply, service: 'BlockRun', model: 'Nemotron 3 Nano Omni' };
  }catch(e){}
  return null;
}
async function tryHardparseOCR(dataUrl){
  try{
    const base64 = dataUrl.split(',')[1];
    const ctrl = new AbortController();
    const to = setTimeout(function(){ ctrl.abort(); }, 30000);
    const res = await fetch('https://hardparse.com/api/ocr', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl.signal,
      body: JSON.stringify({ image: base64 })
    });
    clearTimeout(to);
    if (!res.ok) return null;
    const data = await res.json();
    const text = data.text || data.markdown;
    if (text && text.length > 1) return { text: 'متن استخراج‌شده:\n' + text, service: 'Hardparse OCR', model: 'OCR' };
  }catch(e){}
  return null;
}
async function analyzeImage(file, userText){
  const prompt = userText || 'این عکس رو توصیف کن.';
  const services = [
    { name: 'OpenAI Vision', fn: function(){ return tryPollinationsVision(file.dataUrl, prompt, 'openai'); } },
    { name: 'OpenAI Fast Vision', fn: function(){ return tryPollinationsVision(file.dataUrl, prompt, 'openai-fast'); } },
    { name: 'Gemini Vision', fn: function(){ return tryPollinationsVision(file.dataUrl, prompt, 'gemini'); } },
    { name: 'Mistral Vision', fn: function(){ return tryPollinationsVision(file.dataUrl, prompt, 'mistral'); } },
    { name: 'three.ws Vision', fn: function(){ return tryThreeWsVision(file.dataUrl, prompt); } },
    { name: 'VLM Run Gateway', fn: function(){ return tryVLMRunVision(file.dataUrl, prompt); } },
    { name: 'BlockRun Nemotron', fn: function(){ return tryNemotronVision(file.dataUrl, prompt); } },
    { name: 'Hardparse OCR', fn: function(){ return tryHardparseOCR(file.dataUrl); } }
  ];
  const statuses = services.map(function(s){ return { name: s.name, status: 'pending' }; });
  const results = [];
  await Promise.all(services.map(async function(s, i){
    try{
      const r = await s.fn();
      if (r){ statuses[i].status = 'success'; results.push(r); }
      else statuses[i].status = 'fail';
    }catch(e){ statuses[i].status = 'fail'; }
  }));
  return { results: results, statuses: statuses };
}

/* ================================================================
   دسته‌بندی خودکار
   ================================================================ */
const CAT = { TEXT:'text', IMAGE:'image', MUSIC:'music', CODE:'code', VISION:'vision', VIDEO:'video' };
function detectCategory(text, file){
  if (file && file.type === 'image') return CAT.VISION;
  const t = (text||'').toLowerCase();
  if (/(کد\s*بنویس|کد\s*بزن|برنامه\s*بنویس|اسکریپت\s*بنویس|تابع\s*بنویس|فانکشن|پایتون|جاوا\s*اسکریپت|javascript|python|html|css|php|sql|java|write\s+code)/i.test(t)) return CAT.CODE;
  if (/(فیلم\s*بساز|ویدیو\s*بساز|ویدیو\s*درست|فیلم\s*درست|کلیپ\s*بساز|انیمیشن\s*بساز|video|movie|clip|animation)/i.test(t)) return CAT.VIDEO;
  if (/(آهنگ\s*بساز|موسیقی\s*بساز|ملودی\s*بساز|آهنگ\s*درست|بخون|make\s+(music|song|audio)|compose|sing)/i.test(t)) return CAT.MUSIC;
  if (/(عکس\s*بساز|تصویر\s*بساز|نقاشی\s*بکش|طراحی\s*کن|عکس\s*بکش|draw|image|picture|paint)/i.test(t)) return CAT.IMAGE;
  return CAT.TEXT;
}

/* ================================================================
   پیام‌ها
   ================================================================ */
function addMessage(role, text, extra){
  extra = extra || {};
  const msg = document.createElement('div');
  msg.className = 'message ' + role;
  const av = role === 'user' ? 'user-av' : 'ai';
  let content = escapeHtml(text);
  content = content.replace(/```(\w+)?\n?([\s\S]*?)```/g, '<pre>$2</pre>');
  content = content.replace(/`([^`]+)`/g, '<code>$1</code>');
  let media = '';
  if (extra.type === 'image' && extra.url) media = '<img src="' + extra.url + '" alt="تصویر" loading="lazy">';
  else if (extra.type === 'audio' && extra.url) media = '<audio controls preload="metadata" src="' + extra.url + '"></audio>';
  else if (extra.type === 'video' && extra.url) media = '<video controls preload="metadata" src="' + extra.url + '" style="max-width:100%"></video>';
  let badge = '';
  if (extra.service) badge = '<div class="service-badge">🎬 ' + extra.service + (extra.model ? ' — ' + extra.model : '') + '</div>';
  let statusList = '';
  if (extra.statuses){
    statusList = '<div class="status-list">';
    extra.statuses.forEach(function(s){
      const cls = s.status === 'success' ? 'success' : (s.status === 'fail' ? 'fail' : 'pending');
      const icon = s.status === 'success' ? '✅' : (s.status === 'fail' ? '❌' : '⏳');
      statusList += '<div class="status-item"><span class="dot ' + cls + '"></span>' + icon + ' ' + s.name + '</div>';
    });
    statusList += '</div>';
  }
  let analysis = '';
  if (extra.analysisText) analysis = '<div style="margin-top:10px;padding:12px;background:rgba(0,217,126,.08);border:1px solid rgba(0,217,126,.25);border-radius:12px;font-size:.88rem;line-height:1.8">' + escapeHtml(extra.analysisText) + '</div>';
  const encoded = btoa(unescape(encodeURIComponent(text)));
  const actions = role === 'ai' ? (
    '<div class="message-actions">' +
    '<button class="action-btn" onclick="copyMsg(this, \'' + encoded + '\')" title="کپی"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>' +
    '<button class="action-btn" onclick="speakMsg(\'' + encoded + '\')" title="خواندن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg></button>' +
    '<button class="action-btn" onclick="downloadMsg(\'' + encoded + '\')" title="دانلود"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>' +
    '</div>'
  ) : '';
  msg.innerHTML = '<div class="message-avatar ' + av + '">م</div><div class="message-content"><div class="message-bubble">' + badge + content + media + analysis + statusList + '</div>' + actions + '</div>';
  chatArea.appendChild(msg);
  scrollToBottom();
}

function addTyping(){
  const m = document.createElement('div');
  m.className = 'message ai'; m.id = 'typingMsg';
  m.innerHTML = '<div class="message-avatar ai">م</div><div class="message-content"><div class="message-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div></div>';
  chatArea.appendChild(m); scrollToBottom();
}
function removeTyping(){ const el = document.getElementById('typingMsg'); if (el) el.remove(); }

function copyMsg(btn, encoded){
  const text = decodeURIComponent(escape(atob(encoded)));
  navigator.clipboard.writeText(text).then(function(){ btn.classList.add('done'); showToast('✅ کپی شد'); setTimeout(function(){ btn.classList.remove('done'); }, 1500); });
}
function speakMsg(encoded){
  const text = decodeURIComponent(escape(atob(encoded)));
  if (!('speechSynthesis' in window)) return showToast('پشتیبانی نمی‌شود');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.substring(0, 1000));
  u.lang = 'fa-IR'; u.rate = 1;
  speechSynthesis.speak(u);
  showToast('🔊 در حال خواندن');
}
function downloadMsg(encoded){
  const text = decodeURIComponent(escape(atob(encoded)));
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mohammadsam_' + Date.now() + '.txt';
  a.click();
  showToast('📥 دانلود شد');
}

function attachFile(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = async function(e){
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > MAX_FILE_SIZE){ showToast('❌ حداکثر ۲۰۰MB'); return; }
    try{
      const dataUrl = await readAsDataURL(file);
      attachedFile = { type: 'image', dataUrl: dataUrl, name: file.name };
      showFilePreview();
      showToast('✅ عکس آماده است');
    }catch(err){ showToast('❌ خطا'); }
  };
  input.click();
}
function readAsDataURL(file){
  return new Promise(function(res, rej){ const r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = rej; r.readAsDataURL(file); });
}
function showFilePreview(){
  if (!attachedFile) return;
  filePreview.classList.add('show');
  filePreviewImg.src = attachedFile.dataUrl;
  fileInfo.textContent = attachedFile.name;
}
function removeFile(){
  attachedFile = null;
  filePreview.classList.remove('show');
  filePreviewImg.src = '';
}

async function sendMessage(){
  if (isGenerating) return;
  const text = chatInput.value.trim();
  if (!text && !attachedFile) return;
  if (isFirstMessage){
    centerContent.classList.add('hidden');
    chatArea.classList.add('active');
    isFirstMessage = false;
  }
  const userMsg = text || '[عکس]';
  addMessage('user', userMsg, attachedFile ? { type: 'image', url: attachedFile.dataUrl } : {});
  const file = attachedFile;
  removeFile();
  chatInput.value = '';
  sendBtn.classList.remove('active');
  isGenerating = true;
  const category = detectCategory(text, file);
  addTyping();
  try{
    if (category === CAT.IMAGE){
      const r = await generateImage(text);
      removeTyping();
      if (r.results.length === 0) addMessage('ai', '⚠️ هیچ سرویسی نتونست عکس بسازه.', { statuses: r.statuses });
      else {
        addMessage('ai', '🎨 ' + r.results.length + ' عکس از ' + r.statuses.length + ' سرویس ساخته شد:', { statuses: r.statuses });
        r.results.forEach(function(x){ addMessage('ai', '🎨 عکس:', { type: 'image', url: x.url, service: x.service, model: x.model }); });
      }
    }
    else if (category === CAT.MUSIC){
      const r = await generateMusic(text);
      removeTyping();
      if (r.results.length === 0) addMessage('ai', '⚠️ هیچ سرویسی نتونست آهنگ بسازه.', { statuses: r.statuses });
      else {
        addMessage('ai', '🎵 ' + r.results.length + ' آهنگ ساخته شد:', { statuses: r.statuses });
        r.results.forEach(function(x){ addMessage('ai', '🎵 آهنگ:', { type: 'audio', url: x.url, service: x.service, model: x.model }); });
      }
    }
    else if (category === CAT.VIDEO){
      const r = await generateVideo(text);
      removeTyping();
      if (r.results.length === 0) addMessage('ai', '⚠️ هیچ سرویسی نتونست ویدیو بسازه.', { statuses: r.statuses });
      else {
        addMessage('ai', '🎬 ' + r.results.length + ' ویدیو ساخته شد:', { statuses: r.statuses });
        r.results.forEach(function(x){ addMessage('ai', '🎬 ویدیو:', { type: x.type || 'video', url: x.url, service: x.service, model: x.model }); });
      }
    }
    else if (category === CAT.VISION){
      const r = await analyzeImage(file, text);
      removeTyping();
      if (r.results.length === 0) addMessage('ai', '⚠️ هیچ سرویسی نتونست تحلیل کنه.', { statuses: r.statuses });
      else {
        addMessage('ai', '🖼️ ' + r.results.length + ' تحلیل دریافت شد:', { statuses: r.statuses });
        r.results.forEach(function(x){ addMessage('ai', '🖼️ تحلیل:', { service: x.service, model: x.model, analysisText: x.text }); });
      }
    }
    else if (category === CAT.CODE){
      const r = await chatCode(text);
      removeTyping();
      addMessage('ai', r.text, { service: r.service, statuses: r.statuses });
    }
    else {
      const r = await chatText(text);
      removeTyping();
      addMessage('ai', r.text, { service: r.service, statuses: r.statuses });
    }
  }catch(err){
    removeTyping();
    addMessage('ai', '⚠️ خطا: ' + (err.message || 'دوباره امتحان کن'));
  }
  isGenerating = false;
}

function quickSend(text){
  chatInput.value = text;
  sendBtn.classList.add('active');
  sendMessage();
}

function toggleVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ showToast('مرورگر پشتیبانی نمی‌کند.'); return; }
  const micBtn = document.getElementById('micBtn');
  if (isRecording && recognition){ recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = 'fa-IR'; recognition.continuous = false; recognition.interimResults = false;
  recognition.onstart = function(){ isRecording = true; micBtn.classList.add('recording'); showToast('🎤 ضبط...'); };
  recognition.onend = function(){ isRecording = false; micBtn.classList.remove('recording'); };
  recognition.onresult = function(e){ chatInput.value = e.results[0][0].transcript; sendBtn.classList.add('active'); setTimeout(function(){ sendMessage(); }, 400); };
  recognition.onerror = function(){ isRecording = false; micBtn.classList.remove('recording'); };
  try{ recognition.start(); }catch(e){}
}

function newChat(){
  chatArea.innerHTML = '';
  chatArea.classList.remove('active');
  centerContent.classList.remove('hidden');
  isFirstMessage = true;
  isGenerating = false;
  removeFile();
  chatInput.value = '';
  sendBtn.classList.remove('active');
  showToast('✨ گفتگوی جدید');
}

chatInput.addEventListener('input', function(){
  sendBtn.classList.toggle('active', !!this.value.trim() || !!attachedFile);
});
chatInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    if (this.value.trim() || attachedFile) sendMessage();
  }
});

window.addEventListener('DOMContentLoaded', function(){
  createParticles();
  chatInput.focus();
  console.log('%c✅ محمد سام ملک زاده — ۴۰+ سرویس','color:#4285f4;font-size:14px;font-weight:bold');
});
</script>
